<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Congress Watcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold text-gray-900">Congress Watcher</h1>
      <p class="text-sm text-gray-500 mt-1">Non-partisan, AI-summarized US Congressional tracking</p>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <div id="bills-container" class="min-h-[300px] flex items-center justify-center">
      <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
        <p class="text-gray-500">Connecting to database and loading recent votes...</p>
      </div>
    </div>
  </main>

  <!-- Load self-contained ES module script -->
  <script type="module" src="app.js"></script>

</body>
</html>
