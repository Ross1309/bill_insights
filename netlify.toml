[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"
# Nightly syncs (Netlify scheduled functions, cron in UTC; 30s limit; can't be called by
# URL in production; use "Run now" in the Netlify UI to trigger one manually).
# 10:00 UTC = 5-6 AM Eastern, after any late-night floor votes are published.
[functions."ingest-votes"]
  schedule = "0 10 * * *"

# Bills after votes, so the new day's activity is in both.
[functions."sync-bills"]
  schedule = "30 10 * * *"
