[build]
  command = "npm install && npm test"  # unit tests gate every deploy
  publish = "public"
  functions = "netlify/functions"

# Netlify's secret scanner flags the Firebase *web* config apiKey in public/app.js.
# That key is a public project identifier (it ships to every browser); data is protected
# by Firestore security rules. Exempt only this value so real secrets are still caught.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB53n86BTG9co1S8Ek0Acvx4onbzvXQD8Y"
# Nightly syncs (Netlify scheduled functions, cron in UTC; 30s limit; can't be called by
# URL in production; use "Run now" in the Netlify UI to trigger one manually).
# 10:00 UTC = 5-6 AM Eastern, after any late-night floor votes are published.
[functions."ingest-votes"]
  schedule = "0 10 * * *"

# Bills after votes, so the new day's activity is in both.
[functions."sync-bills"]
  schedule = "30 10 * * *"

# "This Congress so far" series: bills introduced / passed a chamber since the last run,
# then stats/congress-<n> rebuilt (after the other two, which it reads).
[functions."sync-congress-stats"]
  schedule = "0 11 * * *"

# Security headers for every page and file. The Content-Security-Policy allows only what
# the site uses: Firebase SDK + reCAPTCHA (www.gstatic.com, www.google.com), Firestore and
# App Check APIs, member photos from congress.gov; fonts are self-hosted. Style attributes
# are used for chart positions/colors, hence 'unsafe-inline' for styles (not scripts).
# Adding an outside script, image or API? Add its origin here, or browsers block it
# (the smoke test fails on the console error).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com; font-src 'self'; img-src 'self' data: https://www.congress.gov; connect-src 'self' https://firestore.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com; frame-src https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Self-hosted fonts never change in place (a new version gets a new file name).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
